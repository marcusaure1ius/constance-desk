name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm run lint

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npx tsc --noEmit

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm test

  migrations:
    needs: setup
    runs-on: ubuntu-latest
    env:
      # Подключение не используется: `check` и `generate` работают с файлами
      # миграций и схемой, к базе не ходят.
      DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      # Журнал миграций цел: нет коллизий и разрывов
      - run: npm run db:check

      # Схема не разошлась с миграциями: если schema.ts изменили без
      # `db:generate`, здесь появится новый файл и джоба упадёт.
      - name: Проверить, что схема покрыта миграциями
        run: |
          npm run db:generate
          if ! git diff --quiet --exit-code drizzle/; then
            echo "::error::schema.ts изменён без миграции. Запустите npm run db:generate и закоммитьте drizzle/"
            git --no-pager diff --stat drizzle/
            exit 1
          fi
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Появились несохранённые файлы миграций:"
            git status --porcelain drizzle/
            exit 1
          fi

  build:
    needs: [lint, typecheck, test, migrations]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
      SESSION_SECRET: ci-dummy-secret-value
      AGENT_API_KEY: ci-dummy-agent-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm run build
