name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Интеграционные тесты Groq ходят в живой API — только по кнопке, см. джобу
  # groq-integration.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm run lint

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npx tsc --noEmit

  # Основной прогон: офлайн и без чужих квот. Файлы *.integration.test.ts
  # исключены маской в vitest.config.ts, сеть заглушена setupFile.
  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm test

  migrations:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: constance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/constance_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      # Журнал миграций цел: нет коллизий и разрывов
      - run: npm run db:check

      # Миграции реально применяются к чистой базе. Драйвер выбирается
      # автоматически: пакет pg стоит в devDependencies и имеет приоритет
      # над @neondatabase/serverless, который умеет только websocket.
      - name: Применить миграции к чистой базе
        run: npm run db:migrate

      # Повторный прогон не должен ничего менять
      - name: Проверить идемпотентность
        run: npm run db:migrate

      # Часть поведения выполняет сама база, а не наш код: регистронезависимость
      # и экранирование шаблона LIKE в поиске, ON CONFLICT DO NOTHING в дедупе
      # апдейтов. На моках drizzle такие тесты были бы бутафорией.
      # В основной прогон эти файлы не входят — здесь они запускаются явно.
      # Прогон вынесен в scripts/run-db-integration.sh: он же и сторож. Сам по
      # себе vitest выходит с кодом 0 на строке «1 passed, 12 skipped», так что
      # шаг мог бы позеленеть, ничего не проверив. Скрипт требует непустую
      # TEST_DATABASE_URL до прогона и хотя бы один выполненный тест после.
      - name: Интеграционные тесты на настоящей базе
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/constance_ci
        run: npm run test:integration:db

      # Схема не разошлась с миграциями. Шаг вынесен в скрипт, чтобы его можно
      # было прогнать локально ровно тем же кодом: `npm run db:drift`.
      # Проверка построена на положительном признаке успеха — прежний вариант
      # (db:generate < /dev/null + git status) пропускал переименование
      # колонки: drizzle-kit печатал «Interactive prompts require a TTY» и
      # выходил с кодом 0, не сгенерировав миграцию.
      - name: Проверить, что схема покрыта миграциями
        run: npm run db:drift

  # Живой Groq — только по кнопке (workflow_dispatch). В гейт PR эти тесты не
  # входят намеренно: у ключа квота, из-за неё прогон и падал по HTTP 429.
  # Нужен секрет GROQ_API_KEY в настройках репозитория, иначе шаг упадёт.
  groq-integration:
    if: github.event_name == 'workflow_dispatch'
    needs: setup
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm run test:integration:groq

  build:
    needs: [lint, typecheck, test, migrations]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
      SESSION_SECRET: ci-dummy-secret-value
      AGENT_API_KEY: ci-dummy-agent-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm run build
