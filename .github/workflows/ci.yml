name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm run lint

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npx tsc --noEmit

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm test

  migrations:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: constance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/constance_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      # Журнал миграций цел: нет коллизий и разрывов
      - run: npm run db:check

      # Миграции реально применяются к чистой базе. Драйвер выбирается
      # автоматически: пакет pg стоит в devDependencies и имеет приоритет
      # над @neondatabase/serverless, который умеет только websocket.
      - name: Применить миграции к чистой базе
        run: npm run db:migrate

      # Повторный прогон не должен ничего менять
      - name: Проверить идемпотентность
        run: npm run db:migrate

      # Поиск проверяется на настоящей базе: регистронезависимость, экранирование
      # шаблона LIKE и порядок страниц выполняет PostgreSQL, а не наш код, —
      # на моках drizzle такие тесты были бы бутафорией.
      - name: Интеграционные тесты поиска
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/constance_ci
        run: npm test -- tests/search.integration.test.ts

      # Схема не разошлась с миграциями: если schema.ts изменили без
      # db:generate, здесь появится новый файл и джоба упадёт.
      - name: Проверить, что схема покрыта миграциями
        run: |
          npm run db:generate < /dev/null
          if ! git diff --quiet --exit-code drizzle/ || [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::schema.ts изменён без миграции. Запустите npm run db:generate и закоммитьте drizzle/"
            git --no-pager diff --stat drizzle/
            git status --porcelain drizzle/
            exit 1
          fi

  build:
    needs: [lint, typecheck, test, migrations]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
      SESSION_SECRET: ci-dummy-secret-value
      AGENT_API_KEY: ci-dummy-agent-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm run build
